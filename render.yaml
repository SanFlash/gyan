services:
  - type: web
    name: gyanpath-ngo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AUTO_INIT_DB
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "false"
