{% extends "admin/base.html" %}{% block title %}Event | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Content</span><h1>{{'Edit' if event else 'Add'}} event</h1></div></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" required value="{{event.title if event else ''}}"></label><label>Description<textarea name="description" rows="5">{{event.description if event else ''}}</textarea></label><label>Location<input name="location" value="{{event.location if event else ''}}"></label><label>Date<input type="date" name="event_date" value="{{event.event_date.strftime('%Y-%m-%d') if event and event.event_date else ''}}"></label><label>Status<select name="status">{% for x in ['Upcoming','Ongoing','Completed','Cancelled'] %}<option {{'selected' if event and event.status==x else ''}}>{{x}}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="registration_enabled" {{'checked' if event and event.registration_enabled else ''}}> Enable registration</label><button class="btn btn-primary">Save event</button></form>{% endblock %}
