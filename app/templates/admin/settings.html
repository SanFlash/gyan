{% extends "admin/base.html" %}{% block title %}Settings | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Configuration</span><h1>Site settings</h1></div></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Organization name<input name="organization_name" value="{{settings.get('organization_name','Gyanpath Shiksha Evam Samaj Kalyan Samiti')}}"></label><label>Tagline<input name="tagline" value="{{settings.get('tagline','Empowering Communities. Creating Opportunities.')}}"></label><label>Public email<input name="public_email" value="{{settings.get('public_email','')}}"></label><label>Public phone<input name="public_phone" value="{{settings.get('public_phone','')}}"></label><label>Address<input name="address" value="{{settings.get('address','Bhopal, Madhya Pradesh, India')}}"></label><label>Facebook URL<input name="facebook_url" value="{{settings.get('facebook_url','')}}"></label><label>Instagram URL<input name="instagram_url" value="{{settings.get('instagram_url','')}}"></label><label>LinkedIn URL<input name="linkedin_url" value="{{settings.get('linkedin_url','')}}"></label><button class="btn btn-primary">Save settings</button></form>{% endblock %}
