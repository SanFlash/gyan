{% extends "admin/base.html" %}{% block title %}Document | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Documents</span><h1>{{'Edit' if item else 'Add'}} document</h1></div></div><form class="form card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{item.title if item else ''}}" required></label><label>Category<input name="category" value="{{item.category if item else 'Other'}}"></label><label>Year<input type="number" name="year" value="{{item.year if item and item.year else ''}}"></label><label>Upload approved document<input type="file" name="document" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip"></label><label>Or approved document URL<input name="document_url" value="{{item.file_url if item else ''}}" placeholder="https://..."></label><label>Description<textarea name="description" rows="5">{{item.description if item else ''}}</textarea></label><label>Visibility<select name="visibility"><option value="private" {% if not item or item.visibility!='public' %}selected{% endif %}>Private</option><option value="public" {% if item and item.visibility=='public' %}selected{% endif %}>Public</option></select></label><button class="btn btn-primary">Save document</button></form>{% endblock %}
