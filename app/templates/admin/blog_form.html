{% extends "admin/base.html" %}{% block title %}News | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>{{'Edit' if item else 'Add'}} news</h1></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" required value="{{item.title if item else ''}}"></label><label>Slug<input name="slug" required value="{{item.slug if item else ''}}"></label><label>Excerpt<textarea name="excerpt" rows="3">{{item.excerpt if item else ''}}</textarea></label><label>Content<textarea name="content" rows="12">{{item.content if item else ''}}</textarea></label><label class="check"><input type="checkbox" name="published" {{'checked' if item and item.published else ''}}> Publish</label><button class="btn btn-primary">Save post</button></form>{% endblock %}
