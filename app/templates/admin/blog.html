{% extends "admin/base.html" %}{% block title %}News | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>News / Blog</h1></div><div class="admin-table">{% for x in items %}<div class="admin-row"><div><strong>{{x.title}}</strong><small>{{x.slug}} · {{'Published' if x.published else 'Draft'}}</small><p>{{x.excerpt}}</p></div></div>{% else %}<div class="empty">News will be added by the organization.</div>{% endfor %}</div>{% endblock %}
