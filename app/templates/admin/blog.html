{% extends "admin/base.html" %}{% block title %}News | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>News / Blog</h1><a class="btn btn-primary" href="{{url_for('admin.blog_new')}}">+ Add post</a></div><div class="admin-table">{% for x in items %}<div class="admin-row"><div><strong>{{x.title}}</strong><small>{{x.slug}} · {{'Published' if x.published else 'Draft'}}</small><p>{{x.excerpt}}</p></div><div class="row-actions"><a href="{{url_for('admin.blog_edit',id=x.id)}}">Edit</a><form method="post" action="{{url_for('admin.blog_delete',id=x.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger-link">Delete</button></form></div></div>{% else %}<div class="empty">No posts yet.</div>{% endfor %}</div>{% endblock %}
