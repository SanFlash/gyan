{% extends "admin/base.html" %}{% block title %}Impact | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>Impact statistics</h1><a class="btn btn-primary" href="{{url_for('admin.impact_new')}}">+ Add statistic</a></div><div class="admin-table">{% for x in items %}<div class="admin-row"><div><strong>{{x.value}}</strong><small>{{x.label}} · Order {{x.sort_order}}</small></div><div class="row-actions"><a href="{{url_for('admin.impact_edit',id=x.id)}}">Edit</a><form method="post" action="{{url_for('admin.impact_delete',id=x.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger-link">Delete</button></form></div></div>{% else %}<div class="empty">No statistics yet.</div>{% endfor %}</div>{% endblock %}
