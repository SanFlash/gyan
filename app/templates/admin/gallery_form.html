{% extends "admin/base.html" %}{% block title %}Gallery item | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Media</span><h1>{{'Edit' if item else 'Add'}} photograph</h1></div></div><form class="form card" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" value="{{item.title if item else ''}}" required></label><label>Category<select name="category"><option>Events</option><option>Artisan Programmes</option><option>Exhibitions</option><option>Training</option><option>Community Activities</option><option>Workshops</option><option>Awareness Programmes</option><option>Other</option></select></label><label>Upload approved image <input type="file" name="image" accept="image/*"></label><label>Or approved hosted image URL<input name="image_url" placeholder="https://..." value="{{item.image_url if item else ''}}"></label><label>Event / programme location<input name="location" value="{{item.location if item else ''}}"></label><label>Date<input type="date" name="event_date" value="{{item.event_date if item and item.event_date else ''}}"></label><label>Description<textarea name="description" rows="5">{{item.description if item else ''}}</textarea></label><label>Display order<input type="number" name="sort_order" value="{{item.sort_order if item else 0}}"></label><label class="check"><input type="checkbox" name="published" {% if item and item.published %}checked{% endif %}> Publish publicly</label><p class="muted">Cloudinary upload is used when CLOUDINARY_* credentials are configured. Otherwise keep the image as an approved hosted URL.</p><button class="btn btn-primary">Save photograph</button></form>{% endblock %}
