{% extends "base.html" %}{% block title %}Manage Projects | Gyanpath{% endblock %}{% block content %}<section class="section admin-page"><div class="container"><div class="admin-head"><div><span class="eyebrow">Content</span><h1 class="section-title">Projects.</h1></div><a class="btn btn-primary" href="{{ url_for('admin.project_create') }}">+ New project</a></div><div class="admin-table">{% for project in projects %}<div class="admin-row"><div><strong>{{project.title}}</strong><small>{{project.status or 'Draft'}}</small></div><div class="row-actions"><a href="{{url_for('public.project_detail',slug=project.slug)}}">View</a><a href="{{url_for('admin.project_edit',project_id=project.id)}}">Edit</a></div></div>{% else %}<div class="empty">No projects yet.</div>{% endfor %}</div></div></section>{% endblock %}
