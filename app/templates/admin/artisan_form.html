{% extends "admin/base.html" %}{% block title %}Artisan | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>{{'Edit' if item else 'Add'}} artisan</h1></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" required value="{{item.name if item else ''}}"></label><label>Slug<input name="slug" required value="{{item.slug if item else ''}}"></label><label>Craft<input name="craft" value="{{item.craft if item else ''}}"></label><label>Location<input name="location" value="{{item.location if item else ''}}"></label><label>Image URL<input name="image_url" value="{{item.image_url if item else ''}}"></label><label>Biography<textarea name="biography" rows="7">{{item.biography if item else ''}}</textarea></label><label class="check"><input type="checkbox" name="published" {{'checked' if not item or item.published else ''}}> Publish</label><button class="btn btn-primary">Save artisan</button></form>{% endblock %}
