{% extends "admin/base.html" %}{% block title %}Impact | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>{{'Edit' if item else 'Add'}} impact statistic</h1></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Value<input name="value" required value="{{item.value if item else ''}}"></label><label>Label<input name="label" required value="{{item.label if item else ''}}"></label><label>Display order<input type="number" name="sort_order" value="{{item.sort_order if item else 0}}"></label><label class="check"><input type="checkbox" name="published" {{'checked' if not item or item.published else ''}}> Publish</label><button class="btn btn-primary">Save statistic</button></form>{% endblock %}
