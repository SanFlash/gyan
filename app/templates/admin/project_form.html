{% extends "admin/base.html" %}{% block title %}{{ 'Edit' if project else 'Add' }} Project | GSSKS{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Projects</span><h1>{{ 'Edit' if project else 'Add' }} project</h1><p class="section-lead">Capture the verified project record without inventing missing information.</p></div></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Project name<input name="title" value="{{project.title if project else ''}}" required></label><label>Slug<input name="slug" value="{{project.slug if project else ''}}" required></label><label>Category<input name="category" value="{{project.category if project else ''}}" required></label><label>Location<input name="location" value="{{project.location if project else ''}}"></label><label>Status<select name="status">{% for x in ['Upcoming','Ongoing','Completed','Archived'] %}<option {% if project and project.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Short description<textarea name="short_description" rows="3">{{project.short_description if project else ''}}</textarea></label><label>Full description<textarea name="description" rows="6">{{project.description if project else ''}}</textarea></label><hr><h2>Project facts</h2><label>Duration / dates<input name="duration" value="{{project.brief.duration if project and project.brief else ''}}"></label><label>Objective<textarea name="objective" rows="4">{{project.brief.objective if project and project.brief else ''}}</textarea></label><label>Target beneficiaries<textarea name="beneficiaries" rows="4">{{project.brief.beneficiaries if project and project.brief else ''}}</textarea></label><label>Activities conducted<textarea name="activities" rows="5">{{project.brief.activities if project and project.brief else ''}}</textarea></label><label>Impact / outcomes<textarea name="outcomes" rows="5">{{project.brief.outcomes if project and project.brief else ''}}</textarea></label><label>Approved project photo URL(s)<textarea name="photos_url" rows="3" placeholder="One approved image URL per line">{{project.brief.photos_url if project and project.brief else ''}}</textarea></label><label>Partners / funding agency<textarea name="partners" rows="3">{{project.brief.partners if project and project.brief else ''}}</textarea></label><label class="check"><input type="checkbox" name="published" {% if not project or project.published %}checked{% endif %}> Publish on public website</label><button class="btn btn-primary" type="submit">{{'Save changes' if project else 'Create project'}}</button></form>{% endblock %}
