{% extends "admin/base.html" %}{% block title %}{{ 'Edit' if project else 'Add' }} Project | Gyanpath{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Content</span><h1>{{ 'Edit' if project else 'Add' }} project</h1></div><a class="btn secondary" href="{{ url_for('admin.projects') }}">Back</a></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" value="{{ project.title if project else '' }}" required></label><label>Slug<input name="slug" value="{{ project.slug if project else '' }}" required></label><label>Category<input name="category" value="{{ project.category if project else '' }}" required></label><label>Location<input name="location" value="{{ project.location if project else '' }}"></label><label>Status<select name="status">{% for x in ['Upcoming','Ongoing','Completed','Archived'] %}<option {% if project and project.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Short description<textarea name="short_description" rows="3">{{ project.short_description if project else '' }}</textarea></label><label>Description<textarea name="description" rows="8">{{ project.description if project else '' }}</textarea></label><label class="check"><input type="checkbox" name="published" {% if not project or project.published %}checked{% endif %}> Publish on public website</label><button class="btn" type="submit">{{ 'Save changes' if project else 'Create project' }}</button></form>{% endblock %}
