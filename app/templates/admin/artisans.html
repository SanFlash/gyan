{% extends "admin/base.html" %}{% block title %}Artisans | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><h1>Artisans</h1><a class="btn btn-primary" href="{{url_for('admin.artisan_new')}}">+ Add artisan</a></div><div class="admin-table">{% for x in items %}<div class="admin-row"><div><strong>{{x.name}}</strong><small>{{x.craft}} · {{x.location}} · {{'Published' if x.published else 'Draft'}}</small></div><div class="row-actions"><a href="{{url_for('admin.artisan_edit',id=x.id)}}">Edit</a><form method="post" action="{{url_for('admin.artisan_delete',id=x.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger-link">Delete</button></form></div></div>{% else %}<div class="empty">No artisans yet.</div>{% endfor %}</div>{% endblock %}
