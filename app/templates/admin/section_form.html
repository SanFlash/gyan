{% extends "admin/base.html" %}{% block title %}{{'Edit' if item else 'Add'}} Section | Admin{% endblock %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">Flexible CMS</span><h1>{{'Edit' if item else 'Add'}} section</h1><p class="section-lead">All fields are optional except slug and title. Publishing controls whether the block is visible.</p></div></div><form class="form card admin-form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Slug<input name="slug" value="{{item.slug if item else ''}}" required placeholder="child-protection-update"></label><label>Eyebrow<input name="eyebrow" value="{{item.eyebrow if item else ''}}" placeholder="Our Work"></label><label>Title<input name="title" value="{{item.title if item else ''}}" required></label><label>Content<textarea name="body" rows="8" placeholder="Write the approved section content here...">{{item.body if item else ''}}</textarea></label><label>Image URL<input name="image_url" value="{{item.image_url if item else ''}}" placeholder="Approved hosted image URL (optional)"></label><label>CTA label<input name="cta_label" value="{{item.cta_label if item else ''}}" placeholder="Learn more →"></label><label>CTA URL<input name="cta_url" value="{{item.cta_url if item else ''}}" placeholder="/icps or https://..."></label><label>Placement<select name="placement"><option value="home" {% if not item or item.placement=='home' %}selected{% endif %}>Homepage</option><option value="work" {% if item and item.placement=='work' %}selected{% endif %}>Our Work</option><option value="icps" {% if item and item.placement=='icps' %}selected{% endif %}>ICPS</option><option value="recognition" {% if item and item.placement=='recognition' %}selected{% endif %}>Recognition</option><option value="projects" {% if item and item.placement=='projects' %}selected{% endif %}>Projects</option></select></label><label>Display order<input type="number" name="sort_order" value="{{item.sort_order if item else 0}}"></label><label class="check"><input type="checkbox" name="published" {% if item and item.published %}checked{% endif %}> Publish this section</label><button class="btn btn-primary">Save section</button></form>{% endblock %}
