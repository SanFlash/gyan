{% extends "base.html" %}{% block title %}Support | Gyanpath{% endblock %}{% block content %}<section class="page-hero"><div class="container"><span class="eyebrow">Support</span><h1>Support verified initiatives.</h1></div></section><section class="section"><div class="container narrow"><div class="notice">Payment gateway is not activated in this build. This form records a support request only.</div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" placeholder="Name" required><input type="email" name="email" placeholder="Email" required><input name="phone" placeholder="Phone"><input type="number" min="1" step=".01" name="amount" placeholder="Amount (INR)" required><input name="purpose" placeholder="Purpose"><label class="check"><input type="checkbox" name="anonymous"> Keep my name anonymous</label><button class="btn">Submit support request</button></form></div></section>{% endblock %}
