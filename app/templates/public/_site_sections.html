{% if sections %}<section class="section cms-sections"><div class="container">{% for s in sections %}<article class="cms-content-section"><div class="cms-section-grid {% if s.image_url %}has-image{% endif %}">{% if s.image_url %}<div class="cms-section-media"><img src="{{s.image_url}}" alt="" loading="lazy"></div>{% endif %}<div><span class="eyebrow">{{s.eyebrow}}</span><h2 class="section-title">{{s.title}}</h2><div class="custom-section-body">{{s.body|e|replace('\n','<br>')|safe}}</div>{% if s.cta_label and s.cta_url %}<a class="btn btn-primary" href="{{s.cta_url}}">{{s.cta_label}}</a>{% endif %}</div></div></article>{% endfor %}</div></section>{% endif %}
