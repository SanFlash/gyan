{% extends "base.html" %}{% block title %}Register | Gyanpath{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card"><span class="eyebrow">Join Gyanpath</span><h1>Create an account.</h1><p class="muted">Register for customer access.</p><form method="post" action="{{ url_for('auth.register') }}"><label>Name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"></label><button class="btn btn-primary full" type="submit">Create account</button></form></div></section>{% endblock %}
