{% extends "base.html" %}{% block title %}Create account | Gyanpath{% endblock %}{% block content %}<section class="section"><div class="container narrow"><div class="section-head"><span class="eyebrow">Account</span><h1 class="section-title">Create your account.</h1></div><form class="form card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary">Create account</button><p>Already registered? <a href="{{url_for('auth.login')}}">Sign in</a></p></form></div></section>{% endblock %}
